name: "Credential Compromise Response"
description: "Response playbook for credential compromise incidents"

steps:
  - phase: "Immediate Actions"
    actions:
      - action: "Disable compromised account"
        description: "Immediately disable account: {user}"
        command: "Disable-ADAccount -Identity {user}"
        requires_approval: true
        
      - action: "Terminate active sessions"
        description: "Terminate all active sessions for: {user}"
        command: "Revoke-AzureADUserAllRefreshToken -ObjectId {user}"
        requires_approval: true
        
      - action: "Reset password"
        description: "Force password reset for: {user}"
        command: "Set-ADAccountPassword -Identity {user} -Reset"
        requires_approval: true
  
  - phase: "Investigation"
    actions:
      - action: "Review login history"
        description: "Check all logins for {user} in last 30 days"
        query: "index=auth user={user} | stats count by src_ip, timestamp"
        
      - action: "Check for lateral movement"
        description: "Identify systems accessed by compromised account"
        query: "index=windows EventCode=4624 user={user}"
        
      - action: "Review privileged access"
        description: "Check if account accessed sensitive resources"
        query: "index=access user={user} resource=sensitive"
  
  - phase: "Containment"
    actions:
      - action: "Isolate affected systems"
        description: "Network isolate hosts accessed by attacker: {hosts}"
        requires_approval: true
        
      - action: "Block attacker IPs"
        description: "Add firewall rules to block source IPs"
        requires_approval: true
  
  - phase: "Eradication"
    actions:
      - action: "Remove persistence"
        description: "Scan for and remove any backdoors/persistence"
        
      - action: "Update detections"
        description: "Add new IoCs to threat intelligence"
  
  - phase: "Recovery"
    actions:
      - action: "Re-enable account"
        description: "Re-enable account after verification: {user}"
        requires_approval: true
        
      - action: "Monitor for 72 hours"
        description: "Enhanced monitoring of account activity"
  
  - phase: "Post-Incident"
    actions:
      - action: "Implement MFA"
        description: "Enforce MFA for all accounts"
        
      - action: "Security awareness training"
        description: "Mandatory training for affected users"